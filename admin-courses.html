<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses Management | DRx Admin</title>
    <link rel="stylesheet" href="admin-courses.css">
</head>
<body>

<header class="header">
    <h2>DRx Admin</h2>
    <a href="admin.html">← Back to Dashboard</a>
</header>

<div class="container">

    <div class="card">
        <h1>📚 Courses Management</h1>

        <form id="courseForm">
            <div class="form-grid">

                <div>
                    <label for="courseName">Course Name</label>
                    <input type="text" id="courseName" placeholder="Example: B.Pharm" required>
                </div>

                <div>
                    <label for="category">Category</label>
                    <select id="category" required>
                        <option value="">Select Category</option>
                        <option value="10TH">10TH</option>
                        <option value="12TH">12TH</option>
                        <option value="Pharmacy">Pharmacy</option>
                        <option value="Paramedical">Paramedical</option>
                        <option value="Nursing">Nursing</option>
                    </select>
                </div>

                <div>
                    <label for="semester">Semester</label>
                    <input type="text" id="semester" placeholder="Example: Semester 1">
                </div>

                <div>
                    <label for="courseCode">Course Code</label>
                    <input type="text" id="courseCode" placeholder="Example: BP101T">
                </div>

                <div class="full">
                    <label for="description">Description</label>
                    <textarea id="description" placeholder="Course description..."></textarea>
                </div>

                <div class="full">
                    <label for="courseLink">Course Page / Link</label>
                    <input type="text" id="courseLink" placeholder="Example: bpharm.html">
                </div>

                <div class="full">
                    <button class="add-btn" type="submit" id="addCourseBtn">➕ Add Course</button>
                </div>

            </div>
        </form>

        <div id="message"></div>
    </div>

    <div class="card">
        <h1>📋 Existing Courses</h1>
        <div id="courseList">Checking admin login...</div>
    </div>

</div>

<script type="module" src="admin-courses.js"></script>
</body>
</html>
