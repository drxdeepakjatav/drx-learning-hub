<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Tests | DRx Learning Hub</title>

    <link rel="stylesheet" href="../style.css">

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <script src="../firebase-config.js"></script>
    <script src="../script.js" defer></script>
</head>

<body>

<header class="site-header">

    <div class="container nav-container">

        <a href="dashboard.html" class="logo">
            DRx Learning Hub
        </a>

        <button
            class="menu-toggle"
            id="menuToggle">
            ☰
        </button>

        <nav class="main-nav" id="mainNav">

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="courses.html">
                Courses
            </a>

            <a href="videos.html">
                Videos
            </a>

            <a href="notes.html">
                Notes
            </a>

            <a href="tests.html" class="active">
                Tests
            </a>

            <a href="../index.html">
                Website
            </a>

        </nav>

    </div>

</header>


<section class="page-header">

    <div class="container">

        <h1>Manage Online Tests</h1>

        <p>
            Create and manage MCQ tests
        </p>

    </div>

</section>


<section class="section">

    <div class="container">

        <div
            id="message"
            class="alert"
            style="display:none;">
        </div>


        <!-- ================= TEST FORM ================= -->

        <div class="admin-card">

            <h2 id="formTitle">
                Add New Test
            </h2>


            <form id="testForm">

                <div class="form-group">

                    <label for="title">
                        Test Title *
                    </label>

                    <input
                        type="text"
                        id="title"
                        required
                        placeholder="Example: BP102T Unit 1 Test">

                </div>


                <div class="form-group">

                    <label for="courseId">
                        Course *
                    </label>

                    <select
                        id="courseId"
                        required>

                        <option value="">
                            Loading courses...
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="unit">
                        Unit
                    </label>

                    <select id="unit">

                        <option value="">
                            All Units
                        </option>

                        <option value="Unit 1">
                            Unit 1
                        </option>

                        <option value="Unit 2">
                            Unit 2
                        </option>

                        <option value="Unit 3">
                            Unit 3
                        </option>

                        <option value="Unit 4">
                            Unit 4
                        </option>

                        <option value="Unit 5">
                            Unit 5
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="description">
                        Test Description
                    </label>

                    <textarea
                        id="description"
                        rows="4"
                        placeholder="Write test instructions..."></textarea>

                </div>


                <div class="form-group">

                    <label for="duration">
                        Duration (minutes)
                    </label>

                    <input
                        type="number"
                        id="duration"
                        min="1"
                        value="30">

                </div>


                <div class="form-group">

                    <label for="status">
                        Status
                    </label>

                    <select id="status">

                        <option value="active">
                            Active
                        </option>

                        <option value="inactive">
                            Inactive
                        </option>

                    </select>

                </div>


                <hr>


                <!-- ================= QUESTION ================= -->

                <h2>
                    Add Question
                </h2>


                <div class="form-group">

                    <label for="question">
                        Question *
                    </label>

                    <textarea
                        id="question"
                        rows="4"
                        placeholder="Enter MCQ question..."></textarea>

                </div>


                <div class="form-group">

                    <label>
                        Option A *
                    </label>

                    <input
                        type="text"
                        id="optionA"
                        placeholder="Option A">

                </div>


                <div class="form-group">

                    <label>
                        Option B *
                    </label>

                    <input
                        type="text"
                        id="optionB"
                        placeholder="Option B">

                </div>


                <div class="form-group">

                    <label>
                        Option C *
                    </label>

                    <input
                        type="text"
                        id="optionC"
                        placeholder="Option C">

                </div>


                <div class="form-group">

                    <label>
                        Option D *
                    </label>

                    <input
                        type="text"
                        id="optionD"
                        placeholder="Option D">

                </div>


                <div class="form-group">

                    <label>
                        Correct Answer *
                    </label>

                    <select id="correctAnswer">

                        <option value="">
                            Select Correct Answer
                        </option>

                        <option value="A">
                            A
                        </option>

                        <option value="B">
                            B
                        </option>

                        <option value="C">
                            C
                        </option>

                        <option value="D">
                            D
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        Marks
                    </label>

                    <input
                        type="number"
                        id="marks"
                        min="1"
                        value="1">

                </div>


                <button
                    type="button"
                    class="btn btn-secondary"
                    id="addQuestionBtn">

                    + Add Question

                </button>


                <!-- Question Preview -->

                <div
                    id="questionsPreview"
                    style="margin-top:20px;">
                </div>


                <div class="form-actions">

                    <button
                        type="submit"
                        class="btn btn-primary"
                        id="saveBtn">

                        Save Test

                    </button>


                    <button
                        type="button"
                        class="btn btn-secondary"
                        id="cancelBtn"
                        style="display:none;">

                        Cancel

                    </button>

                </div>

            </form>

        </div>


        <!-- ================= TEST LIST ================= -->

        <div class="admin-card">

            <h2>
                All Tests
            </h2>


            <div
                id="testsLoading"
                class="empty-state">

                <div class="loading-spinner"></div>

                <p>
                    Loading tests...
                </p>

            </div>


            <div id="testsContainer"></div>


            <div
                id="noTests"
                class="empty-state"
                style="display:none;">

                <h3>
                    No Tests Found
                </h3>

                <p>
                    Create your first online test above.
                </p>

            </div>

        </div>

    </div>

</section>


<footer class="site-footer">

    <div class="container">

        <div class="footer-bottom">

            <p>
                ©
                <span id="currentYear"></span>
                DRx Learning Hub.
                All Rights Reserved.
            </p>

        </div>

    </div>

</footer>


<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {

        const testForm =
            document.getElementById("testForm");

        const titleInput =
            document.getElementById("title");

        const courseSelect =
            document.getElementById("courseId");

        const unitInput =
            document.getElementById("unit");

        const descriptionInput =
            document.getElementById("description");

        const durationInput =
            document.getElementById("duration");

        const statusInput =
            document.getElementById("status");

        const questionInput =
            document.getElementById("question");

        const optionAInput =
            document.getElementById("optionA");

        const optionBInput =
            document.getElementById("optionB");

        const optionCInput =
            document.getElementById("optionC");

        const optionDInput =
            document.getElementById("optionD");

        const correctAnswerInput =
            document.getElementById("correctAnswer");

        const marksInput =
            document.getElementById("marks");

        const addQuestionBtn =
            document.getElementById("addQuestionBtn");

        const questionsPreview =
            document.getElementById(
                "questionsPreview"
            );

        const testsContainer =
            document.getElementById(
                "testsContainer"
            );

        const testsLoading =
            document.getElementById(
                "testsLoading"
            );

        const noTests =
            document.getElementById(
                "noTests"
            );

        const saveBtn =
            document.getElementById("saveBtn");

        const cancelBtn =
            document.getElementById("cancelBtn");

        const formTitle =
            document.getElementById("formTitle");

        const message =
            document.getElementById("message");


        let questions = [];

        let editingTestId = null;

        let adminUser = null;


        /* ================= MESSAGE ================= */

        function showMessage(
            text,
            type = "success"
        ) {

            message.textContent = text;

            message.className =
                "alert alert-" + type;

            message.style.display = "block";

            setTimeout(
                function () {
                    message.style.display = "none";
                },
                4000
            );

        }


        /* ================= ESCAPE ================= */

        function escapeHTML(value) {

            if (
                value === null ||
                value === undefined
            ) {
                return "";
            }

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        /* ================= ADMIN CHECK ================= */

        auth.onAuthStateChanged(
            async function (user) {

                if (!user) {

                    window.location.href =
                        "admin-login.html";

                    return;

                }

                try {

                    const adminDoc =
                        await db
                            .collection("admins")
                            .doc(user.uid)
                            .get();


                    if (
                        !adminDoc.exists ||
                        adminDoc.data().role !==
                            "admin"
                    ) {

                        await auth.signOut();

                        window.location.href =
                            "admin-login.html";

                        return;

                    }


                    adminUser = user;

                    loadCourses();

                    loadTests();

                }

                catch (error) {

                    console.error(error);

                    showMessage(
                        "Admin verification failed.",
                        "error"
                    );

                }

            }
        );


        /* ================= LOAD COURSES ================= */

        async function loadCourses() {

            try {

                const snapshot =
                    await db
                        .collection("courses")
                        .get();


                courseSelect.innerHTML = `

                    <option value="">
                        Select Course
                    </option>

                `;


                const courses = [];


                snapshot.forEach(
                    function (doc) {

                        courses.push({
                            id: doc.id,
                            ...doc.data()
                        });

                    }
                );


                courses.sort(
                    function (a, b) {

                        return String(
                            a.title || ""
                        ).localeCompare(
                            String(
                                b.title || ""
                            )
                        );

                    }
                );


                courses.forEach(
                    function (course) {

                        const option =
                            document.createElement(
                                "option"
                            );


                        option.value =
                            course.id;


                        option.textContent =
                            (
                                course.title ||
                                course.id
                            )
                            +
                            " (" +
                            (
                                course.courseId ||
                                course.id
                            )
                            +
                            ")";


                        courseSelect.appendChild(
                            option
                        );

                    }
                );

            }

            catch (error) {

                console.error(
                    "Course loading error:",
                    error
                );

                courseSelect.innerHTML = `

                    <option value="">
                        Unable to load courses
                    </option>

                `;

            }

        }


        /* ================= ADD QUESTION ================= */

        addQuestionBtn.addEventListener(
            "click",
            function () {

                const question =
                    questionInput.value.trim();

                const optionA =
                    optionAInput.value.trim();

                const optionB =
                    optionBInput.value.trim();

                const optionC =
                    optionCInput.value.trim();

                const optionD =
                    optionDInput.value.trim();

                const correctAnswer =
                    correctAnswerInput.value;

                const marks =
                    Number(
                        marksInput.value
                    ) || 1;


                if (
                    !question ||
                    !optionA ||
                    !optionB ||
                    !optionC ||
                    !optionD ||
                    !correctAnswer
                ) {

                    showMessage(
                        "Please fill all question fields.",
                        "error"
                    );

                    return;

                }


                questions.push({

                    question: question,

                    options: {

                        A: optionA,
                        B: optionB,
                        C: optionC,
                        D: optionD

                    },

                    correctAnswer:
                        correctAnswer,

                    marks: marks

                });


                renderQuestionPreview();


                questionInput.value = "";

                optionAInput.value = "";

                optionBInput.value = "";

                optionCInput.value = "";

                optionDInput.value = "";

                correctAnswerInput.value = "";

                marksInput.value = 1;


                showMessage(
                    "Question added."
                );

            }
        );


        /* ================= QUESTION PREVIEW ================= */

        function renderQuestionPreview() {

            questionsPreview.innerHTML = "";


            questions.forEach(
                function (item, index) {

                    const div =
                        document.createElement(
                            "div"
                        );


                    div.className =
                        "admin-card";


                    div.innerHTML = `

                        <h3>
                            Question ${index + 1}
                        </h3>

                        <p>
                            ${escapeHTML(
                                item.question
                            )}
                        </p>

                        <p>
                            A. ${escapeHTML(
                                item.options.A
                            )}
                        </p>

                        <p>
                            B. ${escapeHTML(
                                item.options.B
                            )}
                        </p>

                        <p>
                            C. ${escapeHTML(
                                item.options.C
                            )}
                        </p>

                        <p>
                            D. ${escapeHTML(
                                item.options.D
                            )}
                        </p>

                        <p>
                            <strong>
                                Correct:
                            </strong>
                            ${escapeHTML(
                                item.correctAnswer
                            )}
                        </p>

                        <p>
                            <strong>
                                Marks:
                            </strong>
                            ${item.marks}
                        </p>

                        <button
                            type="button"
                            class="btn btn-danger remove-question"
                            data-index="${index}">

                            Remove

                        </button>

                    `;


                    questionsPreview.appendChild(
                        div
                    );

                }
            );


            document
                .querySelectorAll(
                    ".remove-question"
                )
                .forEach(
                    function (button) {

                        button.addEventListener(
                            "click",
                            function () {

                                const index =
                                    Number(
                                        this.dataset.index
                                    );


                                questions.splice(
                                    index,
                                    1
                                );


                                renderQuestionPreview();

                            }
                        );

                    }
                );

        }


        /* ================= SAVE TEST ================= */

        testForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                if (!adminUser) {

                    showMessage(
                        "Admin not authenticated.",
                        "error"
                    );

                    return;

                }


                if (
                    questions.length === 0
                ) {

                    showMessage(
                        "Please add at least one question.",
                        "error"
                    );

                    return;

                }


                const title =
                    titleInput.value.trim();

                const courseId =
                    courseSelect.value;

                const unit =
                    unitInput.value;

                const description =
                    descriptionInput.value.trim();

                const duration =
                    Number(
                        durationInput.value
                    ) || 30;

                const status =
                    statusInput.value;


                if (
                    !title ||
                    !courseId
                ) {

                    showMessage(
                        "Please enter test title and select course.",
                        "error"
                    );

                    return;

                }


                saveBtn.disabled = true;

                saveBtn.textContent =
                    "Saving...";


                try {

                    const testData = {

                        title: title,

                        courseId: courseId,

                        unit: unit,

                        description:
                            description,

                        duration:
                            duration,

                        questions:
                            questions,

                        totalQuestions:
                            questions.length,

                        totalMarks:
                            questions.reduce(
                                function (
                                    total,
                                    item
                                ) {

                                    return (
                                        total +
                                        Number(
                                            item.marks
                                        )
                                    );

                                },
                                0
                            ),

                        status: status,

                        updatedAt:
                            firebase.firestore
                                .FieldValue
                                .serverTimestamp(),

                        updatedBy:
                            adminUser.uid

                    };


                    if (editingTestId) {

                        await db
                            .collection("tests")
                            .doc(
                                editingTestId
                            )
                            .update(
                                testData
                            );


                        showMessage(
                            "Test updated successfully."
                        );

                    }

                    else {

                        testData.createdAt =
                            firebase.firestore
                                .FieldValue
                                .serverTimestamp();

                        testData.createdBy =
                            adminUser.uid;


                        await db
                            .collection("tests")
                            .add(
                                testData
                            );


                        showMessage(
                            "Test created successfully."
                        );

                    }


                    resetForm();

                    loadTests();

                }

                catch (error) {

                    console.error(error);

                    showMessage(
                        "Error saving test: " +
                        error.message,
                        "error"
                    );

                }

                finally {

                    saveBtn.disabled =
                        false;

                    saveBtn.textContent =
                        editingTestId
                            ? "Update Test"
                            : "Save Test";

                }

            }
        );


        /* ================= LOAD TESTS ================= */

        async function loadTests() {

            try {

                testsLoading.style.display =
                    "block";

                testsContainer.innerHTML =
                    "";

                noTests.style.display =
                    "none";


                const snapshot =
                    await db
                        .collection("tests")
                        .get();


                const tests = [];


                snapshot.forEach(
                    function (doc) {

                        tests.push({

                            id: doc.id,

                            ...doc.data()

                        });

                    }
                );


                tests.sort(
                    function (a, b) {

                        const aTime =
                            a.createdAt &&
                            a.createdAt.toMillis
                                ? a.createdAt.toMillis()
                                : 0;

                        const bTime =
                            b.createdAt &&
                            b.createdAt.toMillis
                                ? b.createdAt.toMillis()
                                : 0;


                        return bTime - aTime;

                    }
                );


                testsLoading.style.display =
                    "none";


                if (
                    tests.length === 0
                ) {

                    noTests.style.display =
                        "block";

                    return;

                }


                tests.forEach(
                    function (test) {

                        renderTest(test);

                    }
                );

            }

            catch (error) {

                console.error(error);

                testsLoading.style.display =
                    "none";


                testsContainer.innerHTML = `

                    <div class="alert alert-error">

                        Unable to load tests.

                    </div>

                `;

            }

        }


        /* ================= RENDER TEST ================= */

        function renderTest(test) {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "admin-card";


            const questionsCount =
                Array.isArray(
                    test.questions
                )
                    ? test.questions.length
                    : 0;


            card.innerHTML = `

                <h3>
                    ${escapeHTML(
                        test.title ||
                        "Untitled Test"
                    )}
                </h3>


                <p>

                    <strong>
                        Course:
                    </strong>

                    ${escapeHTML(
                        test.courseId ||
                        ""
                    )}

                </p>


                <p>

                    <strong>
                        Unit:
                    </strong>

                    ${escapeHTML(
                        test.unit ||
                        "All Units"
                    )}

                </p>


                <p>

                    <strong>
                        Questions:
                    </strong>

                    ${questionsCount}

                </p>


                <p>

                    <strong>
                        Total Marks:
                    </strong>

                    ${
                        Number(
                            test.totalMarks
                        ) || 0
                    }

                </p>


                <p>

                    <strong>
                        Duration:
                    </strong>

                    ${
                        Number(
                            test.duration
                        ) || 0
                    } minutes

                </p>


                <p>

                    <strong>
                        Status:
                    </strong>

                    ${escapeHTML(
                        test.status ||
                        "inactive"
                    )}

                </p>


                <div class="form-actions">

                    <button
                        class="btn btn-primary edit-test">

                        Edit

                    </button>


                    <button
                        class="btn btn-danger delete-test">

                        Delete

                    </button>

                </div>

            `;


            testsContainer.appendChild(
                card
            );


            card
                .querySelector(
                    ".edit-test"
                )
                .addEventListener(
                    "click",
                    function () {

                        editTest(test);

                    }
                );


            card
                .querySelector(
                    ".delete-test"
                )
                .addEventListener(
                    "click",
                    function () {

                        deleteTest(
                            test.id
                        );

                    }
                );

        }


        /* ================= EDIT TEST ================= */

        function editTest(test) {

            editingTestId =
                test.id;


            formTitle.textContent =
                "Edit Test";


            saveBtn.textContent =
                "Update Test";


            cancelBtn.style.display =
                "inline-block";


            titleInput.value =
                test.title || "";


            courseSelect.value =
                test.courseId || "";


            unitInput.value =
                test.unit || "";


            descriptionInput.value =
                test.description || "";


            durationInput.value =
                test.duration || 30;


            statusInput.value =
                test.status || "active";


            questions =
                Array.isArray(
                    test.questions
                )
                    ? JSON.parse(
                        JSON.stringify(
                            test.questions
                        )
                    )
                    : [];


            renderQuestionPreview();


            window.scrollTo({

                top: 0,

                behavior: "smooth"

            });

        }


        /* ================= DELETE TEST ================= */

        async function deleteTest(
            testId
        ) {

            if (
                !confirm(
                    "Are you sure you want to delete this test?"
                )
            ) {

                return;

            }


            try {

                await db
                    .collection("tests")
                    .doc(testId)
                    .delete();


                showMessage(
                    "Test deleted successfully."
                );


                loadTests();

            }

            catch (error) {

                console.error(error);

                showMessage(
                    "Error deleting test: " +
                    error.message,
                    "error"
                );

            }

        }


        /* ================= CANCEL ================= */

        cancelBtn.addEventListener(
            "click",
            resetForm
        );


        /* ================= RESET ================= */

        function resetForm() {

            editingTestId = null;

            questions = [];


            testForm.reset();


            durationInput.value =
                30;

            marksInput.value =
                1;


            formTitle.textContent =
                "Add New Test";


            saveBtn.textContent =
                "Save Test";


            cancelBtn.style.display =
                "none";


            questionsPreview.innerHTML =
                "";

        }

    });

</script>

</body>
</html>
