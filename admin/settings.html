<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">

    <title>Site Settings | DRx Admin</title>
    <link rel="icon" type="image/png" href="../favicon.png">
    <link rel="icon" href="../favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="../apple-touch-icon.png">

    <link rel="stylesheet" href="../style.css">

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <script src="../firebase-config.js"></script>
    <script src="../script.js" defer></script>
</head>

<body>

<header class="site-header">

    <div class="container header-inner">

        <a href="dashboard.html" class="logo">DRx Learning Hub</a>

        <button class="menu-toggle" id="menuToggle">☰</button>

        <nav class="main-nav" id="mainNav">
            <button id="logoutBtn" class="btn btn-danger" type="button">Logout</button>
        </nav>

    </div>

</header>

<main>

<section class="page-header">

    <div class="container">

        <h1>Site Settings</h1>

        <p>Switches that change how the whole website works.</p>

    </div>

</section>

<section class="section">

<div class="container">

    <div class="admin-card">

        <h2>Study material access</h2>

        <p id="stateText" style="font-size:17px;margin-bottom:16px;">Loading...</p>

        <label class="switch-row">
            <input type="checkbox" id="allFree">
            <span>
                <strong>All study material is FREE for everyone (no login needed)</strong><br>
                <small>
                    ON: every unit PDF opens for anybody, even without an account, and the payment box is hidden.<br>
                    OFF: only free units are open to everyone. The other units open for enrolled students after payment.
                </small>
            </span>
        </label>

        <div class="form-actions">
            <button type="button" class="btn btn-primary" id="saveBtn">Save Setting</button>
        </div>

        <div id="settingsMessage" class="alert" style="display:none; margin-top:15px;"></div>

    </div>

</div>

</section>

</main>

<footer class="site-footer">
    <div class="container">
        <div class="footer-bottom">
            <p>© <span class="current-year"></span> DRx Learning Hub. All Rights Reserved.</p>
        </div>
    </div>
</footer>

<script src="../admin-settings.js"></script>

</body>
</html>
