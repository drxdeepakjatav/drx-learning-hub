<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Test Results | DRx Learning Hub</title>

    <link rel="icon" type="image/png" href="../favicon.png">
    <link rel="icon" href="../favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="../apple-touch-icon.png">
    
    <link rel="stylesheet" href="../style.css">

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <script src="../firebase-config.js"></script>
    <script src="../script.js" defer></script>
</head>

<body>

<header class="site-header">

    <div class="container nav-container">

        <a href="dashboard.html" class="logo">
            DRx Learning Hub
        </a>

        <button class="menu-toggle" id="menuToggle">
            ☰
        </button>

        <nav class="main-nav" id="mainNav">

            <a href="dashboard.html">Dashboard</a>
            <a href="courses.html">Courses</a>
            <a href="videos.html">Videos</a>
            <a href="notes.html">Notes</a>
            <a href="tests.html">Tests</a>
            <a href="results.html" class="active">Results</a>
            <a href="../index.html">Website</a>

        </nav>

    </div>

</header>


<section class="page-header">

    <div class="container">

        <h1>Test Results</h1>

        <p>
            View student online test performance.
        </p>

    </div>

</section>


<section class="section">

    <div class="container">

        <div
            id="message"
            class="alert"
            style="display:none;">
        </div>


        <!-- Search -->

        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="Search student, email or test..."
            >

        </div>


        <!-- Statistics -->

        <div class="stats-grid">

            <div class="stat-card">

                <h3 id="totalResults">0</h3>

                <p>Total Attempts</p>

            </div>


            <div class="stat-card">

                <h3 id="totalStudents">0</h3>

                <p>Students</p>

            </div>


            <div class="stat-card">

                <h3 id="averagePercentage">0%</h3>

                <p>Average Score</p>

            </div>

        </div>


        <!-- Loading -->

        <div
            id="loading"
            class="empty-state">

            <div class="loading-spinner"></div>

            <p>
                Loading results...
            </p>

        </div>


        <!-- Results -->

        <div
            id="resultsContainer"
            style="display:none;">

        </div>


        <!-- Empty -->

        <div
            id="emptyState"
            class="empty-state"
            style="display:none;">

            <h3>
                No Results Found
            </h3>

            <p>
                Student test results will appear here.
            </p>

        </div>

    </div>

</section>


<footer class="site-footer">

    <div class="container">

        <div class="footer-bottom">

            <p>
                ©
                <span id="currentYear"></span>
                DRx Learning Hub.
                All Rights Reserved.
            </p>

        </div>

    </div>

</footer>


<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {

        const loading =
            document.getElementById(
                "loading"
            );

        const container =
            document.getElementById(
                "resultsContainer"
            );

        const emptyState =
            document.getElementById(
                "emptyState"
            );

        const searchInput =
            document.getElementById(
                "searchInput"
            );


        let allResults = [];


        /* ================= ESCAPE ================= */

        function escapeHTML(value) {

            if (
                value === null ||
                value === undefined
            ) {

                return "";

            }

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        /* ================= ADMIN AUTH ================= */

        auth.onAuthStateChanged(
            async function (user) {

                if (!user) {

                    window.location.href =
                        "admin-login.html";

                    return;

                }


                try {

                    const adminDoc =
                        await db
                            .collection("admins")
                            .doc(user.uid)
                            .get();


                    if (
                        !adminDoc.exists ||
                        adminDoc.data().role !==
                            "admin"
                    ) {

                        await auth.signOut();

                        window.location.href =
                            "admin-login.html";

                        return;

                    }


                    loadResults();

                }

                catch (error) {

                    console.error(error);

                    loading.style.display =
                        "none";

                    container.innerHTML = `

                        <div class="alert alert-error">

                            Admin verification failed.

                        </div>

                    `;

                    container.style.display =
                        "block";

                }

            }
        );


        /* ================= LOAD RESULTS ================= */

        async function loadResults() {

            try {

                loading.style.display =
                    "block";

                container.style.display =
                    "none";

                emptyState.style.display =
                    "none";


                const snapshot =
                    await db
                        .collection("results")
                        .get();


                allResults = [];


                snapshot.forEach(
                    function (doc) {

                        allResults.push({

                            id: doc.id,

                            ...doc.data()

                        });

                    }
                );


                /* Newest first */

                allResults.sort(
                    function (a, b) {

                        const aTime =
                            a.submittedAt &&
                            a.submittedAt.toMillis
                                ? a.submittedAt.toMillis()
                                : 0;


                        const bTime =
                            b.submittedAt &&
                            b.submittedAt.toMillis
                                ? b.submittedAt.toMillis()
                                : 0;


                        return bTime - aTime;

                    }
                );


                updateStatistics(
                    allResults
                );


                loading.style.display =
                    "none";


                renderResults(
                    allResults
                );

            }

            catch (error) {

                console.error(error);

                loading.style.display =
                    "none";

                container.style.display =
                    "block";

                container.innerHTML = `

                    <div class="alert alert-error">

                        Unable to load results.

                        <br><br>

                        ${escapeHTML(
                            error.message
                        )}

                    </div>

                `;

            }

        }


        /* ================= STATISTICS ================= */

        function updateStatistics(
            results
        ) {

            document.getElementById(
                "totalResults"
            ).textContent =
                results.length;


            const studentIds =
                new Set();


            let percentageTotal =
                0;


            let percentageCount =
                0;


            results.forEach(
                function (result) {

                    if (
                        result.studentId
                    ) {

                        studentIds.add(
                            result.studentId
                        );

                    }


                    if (
                        typeof result.percentage ===
                        "number"
                    ) {

                        percentageTotal +=
                            result.percentage;

                        percentageCount++;

                    }

                }
            );


            document.getElementById(
                "totalStudents"
            ).textContent =
                studentIds.size;


            const average =
                percentageCount > 0
                    ? (
                        percentageTotal /
                        percentageCount
                    ).toFixed(2)
                    : 0;


            document.getElementById(
                "averagePercentage"
            ).textContent =
                average + "%";

        }


        /* ================= RENDER ================= */

        function renderResults(
            results
        ) {

            container.innerHTML =
                "";


            if (
                results.length === 0
            ) {

                container.style.display =
                    "none";

                emptyState.style.display =
                    "block";

                return;

            }


            container.style.display =
                "block";

            emptyState.style.display =
                "none";


            results.forEach(
                function (result) {

                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "admin-card";


                    const submittedDate =
                        result.submittedAt &&
                        result.submittedAt.toDate
                            ? result.submittedAt
                                .toDate()
                                .toLocaleString(
                                    "en-IN"
                                )
                            : "Date unavailable";


                    const percentage =
                        Number(
                            result.percentage
                        ) || 0;


                    card.innerHTML = `

                        <h3>
                            ${escapeHTML(
                                result.testTitle ||
                                "Online Test"
                            )}
                        </h3>


                        <p>

                            <strong>
                                Student:
                            </strong>

                            ${escapeHTML(
                                result.studentName ||
                                "Unknown"
                            )}

                        </p>


                        <p>

                            <strong>
                                Email:
                            </strong>

                            ${escapeHTML(
                                result.studentEmail ||
                                "-"
                            )}

                        </p>


                        <p>

                            <strong>
                                Score:
                            </strong>

                            ${Number(
                                result.score
                            ) || 0}

                            /

                            ${Number(
                                result.totalMarks
                            ) || 0}

                        </p>


                        <p>

                            <strong>
                                Percentage:
                            </strong>

                            ${percentage}%

                        </p>


                        <p>

                            <strong>
                                Attempted:
                            </strong>

                            ${Number(
                                result.attempted
                            ) || 0}

                        </p>


                        <p>

                            <strong>
                                Correct:
                            </strong>

                            ${Number(
                                result.correct
                            ) || 0}

                        </p>


                        <p>

                            <strong>
                                Wrong:
                            </strong>

                            ${Number(
                                result.wrong
                            ) || 0}

                        </p>


                        <p>

                            <strong>
                                Submitted:
                            </strong>

                            ${escapeHTML(
                                submittedDate
                            )}

                        </p>


                        <button
                            type="button"
                            class="btn btn-danger delete-result"
                            data-id="${escapeHTML(
                                result.id
                            )}">

                            Delete Result

                        </button>

                    `;


                    container.appendChild(
                        card
                    );

                }
            );


            document
                .querySelectorAll(
                    ".delete-result"
                )
                .forEach(
                    function (button) {

                        button.addEventListener(
                            "click",
                            function () {

                                deleteResult(
                                    this.dataset.id
                                );

                            }
                        );

                    }
                );

        }


        /* ================= DELETE ================= */

        async function deleteResult(
            resultId
        ) {

            const confirmDelete =
                confirm(
                    "Are you sure you want to delete this result?"
                );


            if (!confirmDelete) {

                return;

            }


            try {

                await db
                    .collection("results")
                    .doc(resultId)
                    .delete();


                loadResults();

            }

            catch (error) {

                console.error(error);

                alert(
                    "Unable to delete result: " +
                    error.message
                );

            }

        }


        /* ================= SEARCH ================= */

        searchInput.addEventListener(
            "input",
            function () {

                const keyword =
                    this.value
                        .trim()
                        .toLowerCase();


                if (!keyword) {

                    updateStatistics(
                        allResults
                    );

                    renderResults(
                        allResults
                    );

                    return;

                }


                const filtered =
                    allResults.filter(
                        function (result) {

                            return (

                                String(
                                    result.studentName ||
                                    ""
                                )
                                .toLowerCase()
                                .includes(
                                    keyword
                                )

                                ||

                                String(
                                    result.studentEmail ||
                                    ""
                                )
                                .toLowerCase()
                                .includes(
                                    keyword
                                )

                                ||

                                String(
                                    result.testTitle ||
                                    ""
                                )
                                .toLowerCase()
                                .includes(
                                    keyword
                                )

                            );

                        }
                    );


                updateStatistics(
                    filtered
                );


                renderResults(
                    filtered
                );

            }
        );

    });

</script>

</body>
</html>
