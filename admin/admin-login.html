<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login | DRx Learning Hub</title>

    <!-- Shared CSS -->
    <link rel="stylesheet" href="../style.css">

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="site-header">

    <div class="container header-inner">

        <a href="../index.html" class="logo">
            <span>DRx</span> Learning Hub
        </a>

        <a
            href="../index.html"
            class="btn btn-secondary"
        >
            Back to Website
        </a>

    </div>

</header>


<!-- =====================================================
     ADMIN LOGIN
===================================================== -->

<section class="auth-section">

    <div class="container">

        <div class="auth-card">


            <!-- HEADER -->

            <div class="auth-header">

                <div class="card-icon">
                    🔐
                </div>

                <h1>
                    Admin Login
                </h1>

                <p>
                    DRx Learning Hub Administration
                </p>

            </div>


            <!-- MESSAGE -->

            <div
                id="adminLoginMessage"
                class="alert"
                style="display:none;"
            ></div>


            <!-- FORM -->

            <form id="adminLoginForm">


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="adminEmail">
                        Admin Email
                    </label>

                    <input
                        type="email"
                        id="adminEmail"
                        placeholder="Enter admin email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="adminPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="adminPassword"
                        placeholder="Enter admin password"
                        required
                    >

                </div>


                <!-- LOGIN -->

                <button
                    type="submit"
                    id="adminLoginButton"
                    class="btn btn-primary btn-full"
                >
                    Admin Login
                </button>

            </form>


            <div class="auth-footer">

                <p>
                    <a href="../index.html">
                        ← Back to DRx Learning Hub
                    </a>
                </p>

            </div>

        </div>

    </div>

</section>


<!-- =====================================================
     FOOTER
===================================================== -->

<footer class="site-footer">

    <div class="footer-bottom">

        <p>
            © <span id="currentYear"></span>
            DRx Learning Hub. All Rights Reserved.
        </p>
    </div>

</footer>


<!-- =====================================================
     FIREBASE (modular SDK, database id = "default")
===================================================== -->

<script type="module">

import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";

import {
    initializeAuth,
    signInWithEmailAndPassword,
    signOut,
    browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";

import {
    initializeFirestore,
    doc,
    getDoc
} from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyC-Dcvx06CGjbiqCCXlteLG3IqY3C3x8OE",
    authDomain: "drx-learning-hub.firebaseapp.com",
    projectId: "drx-learning-hub",
    storageBucket: "drx-learning-hub.firebasestorage.app",
    messagingSenderId: "562733337038",
    appId: "1:562733337038:web:2db977c4b545cb1a5f839f",
    measurementId: "G-52EGNHBYF6"
};

const app = initializeApp(firebaseConfig);

const auth = initializeAuth(app, {
    persistence: browserLocalPersistence
});

// IMPORTANT: your Firestore database id is "default" (not "(default)")
const db = initializeFirestore(app, {}, "default");


const form = document.getElementById("adminLoginForm");
const message = document.getElementById("adminLoginMessage");
const button = document.getElementById("adminLoginButton");

const yearEl = document.getElementById("currentYear");
if (yearEl) yearEl.textContent = new Date().getFullYear();

function showMessage(text, ok) {
    message.style.display = "block";
    message.classList.toggle("success", !!ok);
    message.textContent = text;
}

form.addEventListener("submit", async function (event) {

    event.preventDefault();

    if (button.disabled) return;

    const email = document.getElementById("adminEmail").value.trim();
    const password = document.getElementById("adminPassword").value;

    try {

        button.disabled = true;
        button.textContent = "Checking...";
        message.style.display = "none";

        const credential =
            await signInWithEmailAndPassword(auth, email, password);

        const user = credential.user;

        const adminSnap = await getDoc(doc(db, "admins", user.uid));

        if (!adminSnap.exists()) {
            await signOut(auth);
            throw new Error("You are not authorized as an admin.");
        }

        const adminData = adminSnap.data();

        if (adminData.role !== "admin" || adminData.active === false) {
            await signOut(auth);
            throw new Error("Admin access denied.");
        }

        showMessage("Admin login successful!", true);

        setTimeout(function () {
            window.location.href = "dashboard.html";
        }, 1000);

    } catch (error) {

        console.error("Admin Login Error:", error);

        if (error.code === "auth/invalid-credential" ||
            error.code === "auth/wrong-password" ||
            error.code === "auth/user-not-found") {
            showMessage("Invalid admin email or password.");
        } else if (error.code === "auth/too-many-requests") {
            showMessage("Too many attempts. Please try again later.");
        } else if (error.code === "permission-denied") {
            showMessage("Permission denied. Check Firestore rules for the admins collection.");
        } else {
            showMessage(error.message || "Admin login failed.");
        }

        button.disabled = false;
        button.textContent = "Admin Login";
    }
});

</script>


</body>

</html>
