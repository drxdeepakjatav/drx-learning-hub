<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login | DRx Learning Hub</title>

    <link rel="stylesheet" href="../style.css">

</head>


<body>


<header class="site-header">

    <div class="container header-inner">

        <a href="../index.html" class="logo">
            <span>DRx</span> Learning Hub
        </a>

        <a
            href="../index.html"
            class="btn btn-secondary"
        >
            Back to Website
        </a>

    </div>

</header>



<section class="auth-section">

    <div class="container">

        <div class="auth-card">

            <div class="auth-header">

                <div class="card-icon">
                    🔐
                </div>

                <h1>
                    Admin Login
                </h1>

                <p>
                    DRx Learning Hub Administration
                </p>

            </div>


            <div
                id="adminLoginMessage"
                class="alert"
                style="display:none;"
            ></div>


            <form id="adminLoginForm">

                <div class="form-group">

                    <label for="adminEmail">
                        Admin Email
                    </label>

                    <input
                        type="email"
                        id="adminEmail"
                        placeholder="Enter admin email"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="adminPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="adminPassword"
                        placeholder="Enter admin password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    id="adminLoginButton"
                    class="btn btn-primary btn-full"
                >
                    Admin Login
                </button>

            </form>


            <div class="auth-footer">

                <p>
                    <a href="../index.html">
                        ← Back to DRx Learning Hub
                    </a>
                </p>

            </div>

        </div>

    </div>

</section>



<footer class="site-footer">

    <div class="footer-bottom">

        <p>
            © <span id="currentYear"></span>
            DRx Learning Hub. All Rights Reserved.
        </p>
    </div>

</footer>



<!-- =====================================================
     FIREBASE
===================================================== -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="../firebase-config.js"></script>



<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {


        const form =
            document.getElementById(
                "adminLoginForm"
            );


        const message =
            document.getElementById(
                "adminLoginMessage"
            );


        const button =
            document.getElementById(
                "adminLoginButton"
            );


        const currentYear =
            document.getElementById(
                "currentYear"
            );


        if (currentYear) {

            currentYear.textContent =
                new Date().getFullYear();

        }



        // =========================================
        // SHOW MESSAGE
        // =========================================

        function showMessage(
            text,
            type = "error"
        ) {

            message.style.display =
                "block";

            message.textContent =
                text;

            message.className =
                "alert";


            if (type === "success") {

                message.classList.add(
                    "alert-success"
                );

            } else {

                message.classList.add(
                    "alert-error"
                );

            }

        }



        // =========================================
        // ADMIN LOGIN
        // =========================================

        form.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const email =
                    document
                        .getElementById("adminEmail")
                        .value
                        .trim();


                const password =
                    document
                        .getElementById("adminPassword")
                        .value;


                if (!email || !password) {

                    showMessage(
                        "Please enter email and password.",
                        "error"
                    );

                    return;

                }


                button.disabled =
                    true;

                button.textContent =
                    "Checking...";


                try {


                    // =================================
                    // STEP 1
                    // FIREBASE AUTH LOGIN
                    // =================================

                    const credential =
                        await auth
                            .signInWithEmailAndPassword(
                                email,
                                password
                            );


                    const user =
                        credential.user;


                    console.log(
                        "Firebase Auth Success:",
                        user.uid
                    );



                    // =================================
                    // STEP 2
                    // CHECK FIRESTORE ADMIN
                    // =================================

                    const adminDoc =
                        await db
                            .collection("admins")
                            .doc(user.uid)
                            .get();



                    if (!adminDoc.exists) {

                        await auth.signOut();

                        throw new Error(
                            "Login successful, but this account is not registered as an admin in Firestore."
                        );

                    }



                    const adminData =
                        adminDoc.data();



                    if (
                        adminData.role !==
                        "admin"
                    ) {

                        await auth.signOut();

                        throw new Error(
                            "Admin access denied. Firestore role must be 'admin'."
                        );

                    }



                    // =================================
                    // SUCCESS
                    // =================================

                    showMessage(
                        "Admin login successful! Redirecting...",
                        "success"
                    );


                    button.textContent =
                        "Success";


                    setTimeout(
                        function () {

                            window.location.href =
                                "dashboard.html";

                        },
                        700
                    );


                }


                catch (error) {

                    console.error(
                        "ADMIN LOGIN ERROR:",
                        error
                    );


                    let errorMessage =
                        "Admin login failed.";


                    switch (error.code) {


                        case "auth/invalid-email":

                            errorMessage =
                                "Email address is invalid.";

                            break;


                        case "auth/user-not-found":

                            errorMessage =
                                "Admin account not found in Firebase Authentication.";

                            break;


                        case "auth/wrong-password":

                            errorMessage =
                                "Incorrect password.";

                            break;


                        case "auth/invalid-credential":

                            errorMessage =
                                "Invalid email or password.";

                            break;


                        case "auth/user-disabled":

                            errorMessage =
                                "This Firebase account has been disabled.";

                            break;


                        case "auth/too-many-requests":

                            errorMessage =
                                "Too many login attempts. Please try again later.";

                            break;


                        case "permission-denied":

                            errorMessage =
                                "Firestore permission denied. Check Firebase Security Rules.";

                            break;


                        default:

                            if (
                                error.message
                            ) {

                                errorMessage =
                                    error.message;

                            }

                            break;

                    }


                    showMessage(
                        errorMessage,
                        "error"
                    );


                    button.disabled =
                        false;

                    button.textContent =
                        "Admin Login";

                }

            }
        );

    }
);

</script>


</body>

</html>
