<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login | DRx Learning Hub</title>

    <!-- Shared CSS -->
    <link rel="stylesheet" href="../style.css">

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="site-header">

    <div class="container header-inner">

        <a href="../index.html" class="logo">
            <span>DRx</span> Learning Hub
        </a>

        <a
            href="../index.html"
            class="btn btn-secondary"
        >
            Back to Website
        </a>

    </div>

</header>


<!-- =====================================================
     ADMIN LOGIN
===================================================== -->

<section class="auth-section">

    <div class="container">

        <div class="auth-card">


            <!-- HEADER -->

            <div class="auth-header">

                <div class="card-icon">
                    🔐
                </div>

                <h1>
                    Admin Login
                </h1>

                <p>
                    DRx Learning Hub Administration
                </p>

            </div>


            <!-- MESSAGE -->

            <div
                id="adminLoginMessage"
                class="alert"
                style="display:none;"
            ></div>


            <!-- FORM -->

            <form id="adminLoginForm">


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="adminEmail">
                        Admin Email
                    </label>

                    <input
                        type="email"
                        id="adminEmail"
                        placeholder="Enter admin email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="adminPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="adminPassword"
                        placeholder="Enter admin password"
                        required
                    >

                </div>


                <!-- LOGIN -->

                <button
                    type="submit"
                    id="adminLoginButton"
                    class="btn btn-primary btn-full"
                >
                    Admin Login
                </button>

            </form>


            <div class="auth-footer">

                <p>
                    <a href="../index.html">
                        ← Back to DRx Learning Hub
                    </a>
                </p>

            </div>

        </div>

    </div>

</section>


<!-- =====================================================
     FOOTER
===================================================== -->

<footer class="site-footer">

    <div class="footer-bottom">

        <p>
            © <span id="currentYear"></span>
            DRx Learning Hub. All Rights Reserved.
        </p>
    </div>

</footer>


<!-- =====================================================
     FIREBASE
===================================================== -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="../firebase-config.js"></script>


<!-- =====================================================
     ADMIN LOGIN LOGIC
===================================================== -->

<script>

document.addEventListener("DOMContentLoaded", function () {


    const form =
        document.getElementById("adminLoginForm");

    const message =
        document.getElementById("adminLoginMessage");

    const button =
        document.getElementById("adminLoginButton");


    // ================================================
    // LOGIN
    // ================================================

    form.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();


            const email =
                document
                    .getElementById("adminEmail")
                    .value
                    .trim();

            const password =
                document
                    .getElementById("adminPassword")
                    .value;


            try {

                button.disabled =
                    true;

                button.textContent =
                    "Checking...";


                // Firebase Authentication

                const credential =
                    await auth.signInWithEmailAndPassword(
                        email,
                        password
                    );


                const user =
                    credential.user;


                // ====================================
                // CHECK ADMIN ROLE
                // ====================================

                const adminDoc =
                    await db
                        .collection("admins")
                        .doc(user.uid)
                        .get();


                if (
                    !adminDoc.exists
                ) {

                    await auth.signOut();

                    throw new Error(
                        "You are not authorized as an admin."
                    );

                }


                const adminData =
                    adminDoc.data();


                if (
                    adminData.role !== "admin"
                ) {

                    await auth.signOut();

                    throw new Error(
                        "Admin access denied."
                    );

                }


                // ====================================
                // SUCCESS
                // ====================================

                message.style.display =
                    "block";

                message.classList.add(
                    "success"
                );

                message.textContent =
                    "Admin login successful!";


                setTimeout(function () {

                    window.location.href =
                        "dashboard.html";

                }, 1000);


            } catch (error) {

                console.error(
                    "Admin Login Error:",
                    error
                );


                message.style.display =
                    "block";

                message.classList.remove(
                    "success"
                );


                if (
                    error.code ===
                    "auth/invalid-credential"
                ) {

                    message.textContent =
                        "Invalid admin email or password.";

                } else {

                    message.textContent =
                        error.message ||
                        "Admin login failed.";

                }


                button.disabled =
                    false;

                button.textContent =
                    "Admin Login";

            }

        }
    );

});

</script>


</body>

</html>
