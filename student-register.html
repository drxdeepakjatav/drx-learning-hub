<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Registration | DRx Learning Hub</title>

<link rel="stylesheet" href="style.css">

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f5f8fc;
    color: #172033;
    font-family: Arial, sans-serif;
}


/* =========================
   HEADER
========================= */

.header {
    background: #ffffff;
    border-bottom: 1px solid #e5eaf2;
}

.navbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 70px;
}

.logo {
    text-decoration: none;
}

.logo-main {
    font-size: 28px;
    font-weight: 800;
    color: #1f4e8c;
}

.logo-text {
    color: #172033;
    font-weight: 600;
}


/* =========================
   REGISTRATION
========================= */

.registration-section {
    min-height: calc(100vh - 140px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 50px 20px;
}

.registration-box {
    width: 100%;
    max-width: 520px;
    background: #ffffff;
    border: 1px solid #e1e7ef;
    border-radius: 14px;
    padding: 35px;
    box-shadow: 0 10px 30px rgba(20, 50, 90, 0.08);
}

.registration-heading {
    text-align: center;
    margin-bottom: 28px;
}

.registration-heading .icon {
    font-size: 42px;
    margin-bottom: 10px;
}

.registration-heading h1 {
    margin: 0 0 8px;
    color: #1f4e8c;
    font-size: 28px;
}

.registration-heading p {
    margin: 0;
    color: #667085;
    font-size: 14px;
}


/* =========================
   FORM
========================= */

.form-group {
    margin-bottom: 18px;
}

.form-group label {
    display: block;
    margin-bottom: 7px;
    font-weight: 600;
    color: #344054;
    font-size: 14px;
}

.form-group input,
.form-group select {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #d0d5dd;
    border-radius: 8px;
    background: #ffffff;
    color: #172033;
    font-size: 15px;
    outline: none;
}

.form-group input:focus,
.form-group select:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
}


/* =========================
   PASSWORD
========================= */

.password-note {
    font-size: 12px;
    color: #667085;
    margin-top: 5px;
}


/* =========================
   BUTTON
========================= */

.register-btn {
    width: 100%;
    border: none;
    border-radius: 8px;
    padding: 13px;
    background: #1f4e8c;
    color: #ffffff;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
}

.register-btn:hover {
    background: #173f73;
}

.register-btn:disabled {
    opacity: 0.65;
    cursor: not-allowed;
}


/* =========================
   MESSAGE
========================= */

.message {
    display: none;
    margin-bottom: 18px;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.5;
}

.message.success {
    display: block;
    background: #ecfdf3;
    border: 1px solid #a7f3d0;
    color: #067647;
}

.message.error {
    display: block;
    background: #fef3f2;
    border: 1px solid #fecdca;
    color: #b42318;
}

.login-link {
    text-align: center;
    margin-top: 22px;
    font-size: 14px;
    color: #667085;
}

.login-link a {
    color: #1f4e8c;
    font-weight: 600;
    text-decoration: none;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .registration-section {
        padding: 30px 15px;
    }

    .registration-box {
        padding: 25px 20px;
    }

    .registration-heading h1 {
        font-size: 24px;
    }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">

<div class="container navbar">

<a href="index.html" class="logo">

<span class="logo-main">DRx</span>

<span class="logo-text">
Learning Hub
</span>

</a>


<nav>

<a href="index.html">Home</a>

<a href="courses.html">Courses</a>

<a href="video.html">Videos</a>

<a href="notes.html">Notes</a>

<a href="tests.html">Tests</a>

<a href="student-register.html" class="active">
Student Registration
</a>

<a href="about.html">About</a>

<a href="contact.html">Contact</a>

</nav>

</div>

</header>



<!-- =========================
     REGISTRATION SECTION
========================= -->

<section class="registration-section">

<div class="registration-box">


<div class="registration-heading">

<div class="icon">
🎓
</div>

<h1>Student Registration</h1>

<p>
Create your DRx Learning Hub student account
</p>

</div>



<div id="message" class="message"></div>



<form id="registrationForm">


<!-- NAME -->

<div class="form-group">

<label for="studentName">
Full Name
</label>

<input
type="text"
id="studentName"
placeholder="Enter your full name"
required
>

</div>



<!-- EMAIL -->

<div class="form-group">

<label for="studentEmail">
Email Address
</label>

<input
type="email"
id="studentEmail"
placeholder="Enter your email address"
required
>

</div>



<!-- MOBILE -->

<div class="form-group">

<label for="studentMobile">
Mobile Number
</label>

<input
type="tel"
id="studentMobile"
placeholder="Enter your mobile number"
pattern="[0-9]{10}"
maxlength="10"
required
>

</div>



<!-- COURSE -->

<!-- Course Type -->
<div class="form-group">
  <label for="courseType">Course Type</label>

  <select id="courseType" required>
    <option value="">Select course type</option>
    <option value="free">🆓 Free Course</option>
    <option value="paid">💳 Paid Course</option>
  </select>
</div>

<!-- Select Course -->
<div class="form-group">
    <label for="course">Select Course</label>

    <select id="course" name="course" required>
        <option value="" selected disabled>Select your course</option>
        <option value="D.Pharm">D.Pharm</option>
        <option value="B.Pharm">B.Pharm</option>
        <option value="M.Pharm">M.Pharm</option>
        <option value="Pharm.D">Pharm.D</option>
        <option value="ANM">ANM</option>
        <option value="GNM">GNM</option>
        <option value="B.Sc Nursing">B.Sc Nursing</option>
        <option value="M.Sc Nursing">M.Sc Nursing</option>
        <option value="B.Sc Biology">B.Sc Biology</option>
        <option value="B.Sc Chemistry">B.Sc Chemistry</option>
        <option value="B.Sc Physics">B.Sc Physics</option>
        <option value="BMLT">BMLT</option>
        <option value="DMLT">DMLT</option>
        <option value="BPT">BPT</option>
        <option value="MMLT">MMLT</option>
        <option value="10th">10th</option>
        <option value="12th">12th</option>
    </select>
</div>



<!-- PASSWORD -->

<div class="form-group">

<label for="password">
Password
</label>

<input
type="password"
id="password"
placeholder="Create a password"
minlength="6"
required
>

<div class="password-note">
Password must contain at least 6 characters.
</div>

</div>



<!-- CONFIRM PASSWORD -->

<div class="form-group">

<label for="confirmPassword">
Confirm Password
</label>

<input
type="password"
id="confirmPassword"
placeholder="Confirm your password"
minlength="6"
required
>

</div>



<button
type="submit"
class="register-btn"
id="registerBtn"
>

Create Student Account

</button>


</form>



<div class="login-link">

Already have an account?

<a href="student-login.html">
Student Login
</a>

</div>


</div>

</section>



<!-- =========================
     FOOTER
========================= -->

<footer class="footer">

<div class="copyright">

© <span id="year"></span>
DRx Learning Hub | Deepak Jatav

</div>

</footer>



<!-- =========================
     FIREBASE
========================= -->

<script type="module">

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";


import {
    getAuth,
    createUserWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";


import {
    initializeFirestore,
    doc,
    setDoc,
    serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";



/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

    apiKey: "AIzaSyC-Dcvx06CGJbiqCCXlteLG3IqY3C3x8OE",

    authDomain: "drx-learning-hub.firebaseapp.com",

    projectId: "drx-learning-hub",

    storageBucket: "drx-learning-hub.firebasestorage.app",

    messagingSenderId: "562733337038",

    appId: "1:562733337038:web:2db977c4b545cb1a5f839f",

    measurementId: "G-52EGNHBYF6"

};



/* =========================
   INITIALIZE
========================= */

const app =
    initializeApp(firebaseConfig);


const auth =
    getAuth(app);


const db =
    initializeFirestore(
        app,
        {},
        "default"
    );



/* =========================
   ELEMENTS
========================= */

const form =
    document.getElementById(
        "registrationForm"
    );


const message =
    document.getElementById(
        "message"
    );


const registerBtn =
    document.getElementById(
        "registerBtn"
    );



/* =========================
   MESSAGE FUNCTION
========================= */

function showMessage(
    text,
    type
) {

    message.textContent = text;

    message.className =
        "message " + type;

}



/* =========================
   REGISTRATION
========================= */

form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const name =
            document
            .getElementById(
                "studentName"
            )
            .value
            .trim();


        const email =
            document
            .getElementById(
                "studentEmail"
            )
            .value
            .trim();


        const mobile =
            document
            .getElementById(
                "studentMobile"
            )
            .value
            .trim();


        const course =
            document
            .getElementById(
                "course"
            )
            .value;


        const courseType =
            document
            .getElementById(
                "courseType"
            )
            .value;


        const password =
            document
            .getElementById(
                "password"
            )
            .value;


        const confirmPassword =
            document
            .getElementById(
                "confirmPassword"
            )
            .value;



        if (!course || !courseType) {

            showMessage(
                "Please select course type and course.",
                "error"
            );

            return;

        }


        /* PASSWORD CHECK */

        if (
            password !==
            confirmPassword
        ) {

            showMessage(
                "Passwords do not match.",
                "error"
            );

            return;

        }



        if (
            password.length < 6
        ) {

            showMessage(
                "Password must contain at least 6 characters.",
                "error"
            );

            return;

        }



        /* MOBILE CHECK */

        if (
            !/^[0-9]{10}$/.test(mobile)
        ) {

            showMessage(
                "Please enter a valid 10-digit mobile number.",
                "error"
            );

            return;

        }



        /* DISABLE BUTTON */

        registerBtn.disabled =
            true;

        registerBtn.textContent =
            "Creating Account...";



        try {


            /* =========================
               CREATE FIREBASE USER
            ========================= */

            const userCredential =
                await createUserWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            const user =
                userCredential.user;



            /* =========================
               SAVE STUDENT DATA
            ========================= */

            await setDoc(

                doc(
                    db,
                    "users",
                    user.uid
                ),

                {

                    uid:
                    user.uid,

                    name:
                    name,

                    email:
                    email,

                    mobile:
                    mobile,

                    course:
                    course,

                    courseType:
                    courseType,

                    role:
                    "student",

                    active:
                    true,

                    createdAt:
                    serverTimestamp()

                }

            );



            /* =========================
               SUCCESS
            ========================= */

            showMessage(

                "Registration successful! Your student account has been created.",

                "success"

            );


            form.reset();


            registerBtn.textContent =
                "Account Created";


        }

        catch(error) {


            console.error(
                "Registration Error:",
                error
            );


            let errorMessage =
                "Registration failed. Please try again.";



            if (
                error.code ===
                "auth/email-already-in-use"
            ) {

                errorMessage =
                    "This email is already registered. Please use another email or login.";

            }


            else if (
                error.code ===
                "auth/invalid-email"
            ) {

                errorMessage =
                    "Please enter a valid email address.";

            }


            else if (
                error.code ===
                "auth/weak-password"
            ) {

                errorMessage =
                    "Password is too weak. Use at least 6 characters.";

            }



            else if (
                error.code ===
                "permission-denied"
                || error.code ===
                "firestore/permission-denied"
            ) {

                errorMessage =
                    "Account created but data could not be saved (Firestore rules permission denied).";

            }


            else if (
                error.code ===
                "auth/operation-not-allowed"
            ) {

                errorMessage =
                    "Email/Password sign-in is not enabled in Firebase Authentication.";

            }


            else if (
                error.code ===
                "auth/network-request-failed"
            ) {

                errorMessage =
                    "Network error. Please check your internet connection.";

            }


            else if (error.code) {

                errorMessage =
                    "Registration failed (" + error.code + ").";

            }


            showMessage(
                errorMessage,
                "error"
            );


            registerBtn.disabled =
                false;

            registerBtn.textContent =
                "Create Student Account";

        }

    }
);



/* =========================
   YEAR
========================= */

document.getElementById(
    "year"
).textContent =
    new Date().getFullYear();

</script>


</body>
</html>
