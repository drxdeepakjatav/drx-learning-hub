<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registration | DRx Learning Hub</title>
<link rel="stylesheet" href="style.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f8fc;color:#172033;font-family:Arial,sans-serif}
.registration-section{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:35px 15px}
.registration-box{width:100%;max-width:520px;background:#fff;border:1px solid #e1e7ef;border-radius:14px;padding:35px;box-shadow:0 10px 30px rgba(20,50,90,.08)}
.heading{text-align:center;margin-bottom:25px}.heading .icon{font-size:40px}.heading h1{margin:8px 0;color:#1f4e8c}.heading p{margin:0;color:#667085;font-size:14px}
.form-group{margin-bottom:16px}label{display:block;margin-bottom:7px;font-weight:600;font-size:14px}input,select{width:100%;padding:12px 14px;border:1px solid #d0d5dd;border-radius:8px;background:#fff;font-size:15px;outline:none}input:focus,select:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.note{font-size:12px;color:#667085;margin-top:5px}button{width:100%;border:0;border-radius:8px;padding:13px;background:#1f4e8c;color:#fff;font-size:16px;font-weight:700;cursor:pointer}button:disabled{opacity:.65}.message{display:none;margin-bottom:18px;padding:12px 14px;border-radius:8px;font-size:14px}.message.success{display:block;background:#ecfdf3;color:#067647}.message.error{display:block;background:#fef3f2;color:#b42318}.login-link{text-align:center;margin-top:20px;color:#667085;font-size:14px}.login-link a{color:#1f4e8c;font-weight:600;text-decoration:none}
</style>
</head>
<body>
<section class="registration-section"><div class="registration-box">
<div class="heading"><div class="icon">🎓</div><h1>Student Registration</h1><p>Create your DRx Learning Hub student account</p></div>
<div id="message" class="message"></div>
<form id="registrationForm">
<div class="form-group"><label for="studentName">Full Name</label><input type="text" id="studentName" placeholder="Enter your full name" required></div>
<div class="form-group"><label for="studentEmail">Email Address</label><input type="email" id="studentEmail" placeholder="Enter your email address" required></div>
<div class="form-group"><label for="studentMobile">Mobile Number</label><input type="tel" id="studentMobile" placeholder="Enter your 10-digit mobile number" pattern="[0-9]{10}" maxlength="10" required></div>
<div class="form-group"><label for="studentCourse">Select Course</label>
<select id="studentCourse" required><option value="">Select your course</option>
<option>D.Pharm</option><option>B.Pharm</option><option>M.Pharm</option><option>Pharm.D</option><option>ANM</option><option>GNM</option><option>B.Sc Nursing</option><option>M.Sc Nursing</option><option>B.Sc Biology</option><option>B.Sc Chemistry</option><option>B.Sc Physics</option><option>BMLT</option><option>DMLT</option><option>BPT</option><option>MMLT</option><option>10th</option><option>12th</option></select></div>
<div class="form-group"><label for="courseType">Course Type</label><select id="courseType" required><option value="">Select course type</option><option value="free">🆓 Free Course</option><option value="paid">💳 Paid Course</option></select></div>
<div class="form-group"><label for="password">Password</label><input type="password" id="password" placeholder="Create a password" minlength="6" required><div class="note">Minimum 6 characters.</div></div>
<div class="form-group"><label for="confirmPassword">Confirm Password</label><input type="password" id="confirmPassword" placeholder="Confirm your password" minlength="6" required></div>
<button type="submit" id="registerBtn">Create Student Account</button>
</form>
<div class="login-link">Already have an account? <a href="student-login.html">Student Login</a></div>
</div></section>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";
import { initializeFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyC-Dcvx06CGjbiqCCXlteLG3IqY3C3x8OE",
authDomain:"drx-learning-hub.firebaseapp.com",
projectId:"drx-learning-hub",
storageBucket:"drx-learning-hub.firebasestorage.app",
messagingSenderId:"562733337038",
appId:"1:562733337038:web:2db977c4b545cb1a5f839f",
measurementId:"G-52EGNHBYF6"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=initializeFirestore(app,{}, "default");
const form=document.getElementById("registrationForm");
const message=document.getElementById("message");
const registerBtn=document.getElementById("registerBtn");

function showMessage(text,type){message.textContent=text;message.className="message "+type;}

form.addEventListener("submit",async(e)=>{
e.preventDefault();
const name=document.getElementById("studentName").value.trim();
const email=document.getElementById("studentEmail").value.trim();
const mobile=document.getElementById("studentMobile").value.trim();
const course=document.getElementById("studentCourse").value;
const courseType=document.getElementById("courseType").value;
const password=document.getElementById("password").value;
const confirmPassword=document.getElementById("confirmPassword").value;

if(!course||!courseType)return showMessage("Please select course and course type.","error");
if(!/^[0-9]{10}$/.test(mobile))return showMessage("Please enter a valid 10-digit mobile number.","error");
if(password.length<6)return showMessage("Password must contain at least 6 characters.","error");
if(password!==confirmPassword)return showMessage("Passwords do not match.","error");

registerBtn.disabled=true;registerBtn.textContent="Creating Account...";

try{
await setPersistence(auth,browserLocalPersistence);
const cred=await createUserWithEmailAndPassword(auth,email,password);
const user=cred.user;

await setDoc(doc(db,"users",user.uid),{
uid:user.uid,name,email,mobile,course,courseType,role:"student",active:true,createdAt:serverTimestamp()
});

showMessage("Registration successful! Your student account has been created.","success");
form.reset();registerBtn.textContent="Account Created";
}catch(error){
console.error("Registration Error:",error);
let msg="Registration failed. Please try again.";
if(error.code==="auth/email-already-in-use")msg="This email is already registered. Please use another email or login.";
else if(error.code==="auth/invalid-email")msg="Please enter a valid email address.";
else if(error.code==="auth/weak-password")msg="Password is too weak. Use at least 6 characters.";
else if(error.code==="permission-denied"||error.code==="firestore/permission-denied")msg="Account created, but student data could not be saved. Firestore rules need to allow student registration.";
else if(error.code==="auth/operation-not-allowed")msg="Email/Password sign-in is not enabled in Firebase Authentication.";
else if(error.code==="auth/network-request-failed")msg="Network error. Please check your internet connection.";
else if(error.code)msg="Registration failed ("+error.code+").";
showMessage(msg,"error");registerBtn.disabled=false;registerBtn.textContent="Create Student Account";
}
});
</script>
</body>
</html>
