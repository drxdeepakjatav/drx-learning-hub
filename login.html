<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Student Login | DRx Learning Hub</title>
    <meta name="description" content="Login to your DRx Learning Hub account.">
    <meta name="theme-color" content="#0b5ed7">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="DRx Learning Hub">
    <meta property="og:title" content="Student Login | DRx Learning Hub">
    <meta property="og:description" content="Login to your DRx Learning Hub account.">
    <meta property="og:url" content="https://drx-learning-hub.pages.dev/login.html">
    <meta property="og:image" content="https://drx-learning-hub.pages.dev/og-image.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Student Login | DRx Learning Hub">
    <meta name="twitter:description" content="Login to your DRx Learning Hub account.">
    <meta name="twitter:image" content="https://drx-learning-hub.pages.dev/og-image.png">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <link rel="stylesheet" href="style.css">

</head>


<body>

<!-- ================= HEADER ================= -->

<header class="site-header">

    <div class="container header-inner">

        <a href="index.html" class="logo">
            <span>DRx</span> Learning Hub
        </a>

        <button
            class="menu-toggle"
            id="menuToggle"
            aria-label="Open Menu"
        >
            ☰
        </button>

        <nav
            class="main-nav"
            id="mainNav"
        >

            <a href="index.html">
                Home
            </a>

            <a href="courses.html">
                Courses
            </a>

            <a href="videos.html">
                Videos
            </a>

            <a href="notes.html">
                Notes
            </a>

            <a href="tests.html">
                Tests
            </a>

            <a href="index.html#about">
                About
            </a>

            <a
                href="login.html"
                class="active nav-login"
            >
                Login
            </a>

        </nav>

    </div>

</header>


<!-- ================= LOGIN ================= -->

<section class="auth-section">

    <div class="container">

        <div class="auth-card">

            <div class="auth-header">

                <h1>
                    Student Login
                </h1>

                <p>
                    Login to access your DRx Learning Hub account.
                </p>

            </div>


            <!-- MESSAGE -->

            <div
                id="loginMessage"
                class="alert"
                style="display:none;"
            ></div>


            <!-- LOGIN FORM -->

            <form id="loginForm">

                <!-- EMAIL -->

                <div class="form-group">

                    <label for="loginEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="loginPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <p class="forgot-row">
                    <a href="#" id="forgotLink">Forgot password?</a>
                </p>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="btn btn-primary btn-full"
                    id="loginButton"
                >
                    Login
                </button>

            </form>


            <!-- SIGNUP -->

            <div class="auth-footer">

                <p>
                    Don't have an account?
                    <a href="signup.html">
                        Create Account
                    </a>
                </p>

            </div>

        </div>

    </div>

</section>


<!-- ================= FOOTER ================= -->

<footer class="site-footer">

    <div class="footer-bottom">

        <p>
            © <span id="currentYear"></span>
            DRx Learning Hub. All Rights Reserved.
        </p>

    </div>

</footer>


<!-- ================= FIREBASE ================= -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="firebase-config.js"></script>

<script src="script.js"></script>


<!-- ================= LOGIN LOGIC ================= -->

<script>

document.addEventListener("DOMContentLoaded", function () {

    const loginForm =
        document.getElementById("loginForm");

    const message =
        document.getElementById("loginMessage");

    const button =
        document.getElementById("loginButton");


    // Forgot password: Firebase emails a reset link

    document
        .getElementById("forgotLink")
        .addEventListener("click", async function (event) {

            event.preventDefault();

            const email =
                document.getElementById("loginEmail").value.trim();

            message.style.display = "block";

            message.style.opacity = "1";

            if (!email) {

                message.classList.remove("success");

                message.textContent =
                    "Type your email in the box above first, then click Forgot password.";

                return;
            }

            try {

                await auth.sendPasswordResetEmail(email);

                message.classList.add("success");

                message.textContent =
                    "If this email has an account, a password reset link has been sent. Please check your inbox and the spam folder.";

            } catch (error) {

                message.classList.remove("success");

                message.textContent =
                    error.code === "auth/invalid-email"
                        ? "Please enter a valid email address."
                        : "Could not send the email right now. Please try again later.";
            }
        });


    loginForm.addEventListener("submit", async function (event) {

        event.preventDefault();


        const email =
            document
                .getElementById("loginEmail")
                .value
                .trim();

        const password =
            document
                .getElementById("loginPassword")
                .value;


        try {

            button.disabled = true;

            button.textContent =
                "Logging in...";


            // Firebase Login

            await auth.signInWithEmailAndPassword(
                email,
                password
            );


            message.style.display = "block";

            message.classList.add("success");

            message.textContent =
                "Login successful!";


            // Go to Student Profile

            setTimeout(function () {

                var next = new URLSearchParams(window.location.search).get("next");

                // only allow safe local pages like learn.html?course=BP102T
                if (!next || !/^[\w\-]+\.html(\?[\w\-=&%.]*)?$/.test(next)) {
                    next = "student-profile.html";
                }

                window.location.href = next;

            }, 1000);


        } catch (error) {

            console.error(error);


            message.style.display = "block";

            message.classList.remove("success");


            if (
                error.code ===
                "auth/invalid-credential"
            ) {

                message.textContent =
                    "Invalid email or password.";

            } else if (
                error.code ===
                "auth/user-not-found"
            ) {

                message.textContent =
                    "No account found with this email.";

            } else if (
                error.code ===
                "auth/wrong-password"
            ) {

                message.textContent =
                    "Incorrect password.";

            } else {

                message.textContent =
                    error.message;

            }


            button.disabled = false;

            button.textContent =
                "Login";

        }

    });

});

</script>


</body>

</html>
