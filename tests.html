<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Online Tests | DRx Learning Hub</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="stylesheet" href="style.css">

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <script src="firebase-config.js"></script>
    <script src="script.js" defer></script>
</head>

<body>

<header class="site-header">

    <div class="container nav-container">

        <a href="index.html" class="logo">
            DRx Learning Hub
        </a>

        <button class="menu-toggle" id="menuToggle">
            ☰
        </button>

        <nav class="main-nav" id="mainNav">

            <a href="index.html">Home</a>
            <a href="courses.html">Courses</a>
            <a href="learn.html">Learn</a>
            <a href="videos.html">Videos</a>
            <a href="notes.html">Notes</a>
            <a href="tests.html" class="active">Tests</a>
            <a href="student-profile.html">Profile</a>

        </nav>

    </div>

</header>


<section class="page-header">

    <div class="container">

        <h1>Online Tests</h1>

        <p>
            Practice MCQ tests and check your knowledge.
        </p>

    </div>

</section>


<section class="section">

    <div class="container">

        <!-- Course / unit filter message -->

        <div
            id="filterBanner"
            class="filter-banner"
            style="display:none;">
        </div>


        <!-- Search -->

        <div class="search-box">

            <input
                type="text"
                id="searchTest"
                placeholder="Search tests..."
            >

        </div>


        <!-- Loading -->

        <div id="loading" class="empty-state">

            <div class="loading-spinner"></div>

            <p>Loading tests...</p>

        </div>


        <!-- Error -->

        <div
            id="errorMessage"
            class="alert alert-error"
            style="display:none;">
        </div>


        <!-- Tests -->

        <div id="testsContainer" class="course-grid"></div>


        <!-- Empty -->

        <div id="emptyState" class="empty-state" style="display:none;">

            <h3>No Tests Available</h3>

            <p>New tests will appear here soon.</p>

        </div>

    </div>

</section>


<footer class="site-footer">

    <div class="container">

        <div class="footer-bottom">

            <p>
                © <span id="currentYear"></span>
                DRx Learning Hub. All Rights Reserved.
            </p>

        </div>

    </div>

</footer>


<script>

document.addEventListener("DOMContentLoaded", function () {

    const testsContainer = document.getElementById("testsContainer");
    const loading = document.getElementById("loading");
    const emptyState = document.getElementById("emptyState");
    const errorMessage = document.getElementById("errorMessage");
    const searchInput = document.getElementById("searchTest");
    const filterBanner = document.getElementById("filterBanner");


    // From the Learn page:  tests.html?course=BP102T&unit=2

    const params = new URLSearchParams(window.location.search);

    const filterCourse = (params.get("course") || "").trim();

    const filterUnit = (params.get("unit") || "").trim();

    let filterActive = !!filterCourse;

    let allTests = [];


    function escapeHTML(value) {

        if (value === null || value === undefined) {
            return "";
        }

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    /* ================= COURSE / UNIT FILTER ================= */

    function matchesFilter(test) {

        if (!filterActive) {
            return true;
        }

        if (
            String(test.courseId || "").toLowerCase() !==
            filterCourse.toLowerCase()
        ) {
            return false;
        }

        if (!filterUnit) {
            return true;
        }

        const unitText = String(test.unit || "").toLowerCase().trim();

        // tests for all units are shown in every unit

        if (!unitText || unitText === "all units" || unitText === "all") {
            return true;
        }

        const numbers = unitText.match(/\d+/g) || [];

        return numbers.indexOf(String(Number(filterUnit))) !== -1;

    }

    function updateBanner() {

        if (!filterCourse) {

            filterBanner.style.display = "none";

            return;

        }

        filterBanner.style.display = "block";

        if (filterActive) {

            filterBanner.innerHTML =
                "Showing tests for <strong>" + escapeHTML(filterCourse) + "</strong>" +
                (filterUnit ? ", <strong>Unit " + escapeHTML(filterUnit) + "</strong>" : "") +
                ". <a href=\"#\" id=\"showAllTests\">Show all tests</a>";

            document
                .getElementById("showAllTests")
                .addEventListener("click", function (event) {

                    event.preventDefault();

                    filterActive = false;

                    updateBanner();

                    applySearch();

                });

        } else {

            filterBanner.innerHTML =
                "Showing all tests. <a href=\"#\" id=\"showCourseTests\">Show only " +
                escapeHTML(filterCourse) + (filterUnit ? " Unit " + escapeHTML(filterUnit) : "") +
                " tests</a>";

            document
                .getElementById("showCourseTests")
                .addEventListener("click", function (event) {

                    event.preventDefault();

                    filterActive = true;

                    updateBanner();

                    applySearch();

                });

        }

    }


    /* ================= LOAD TESTS ================= */

    async function loadTests() {

        try {

            loading.style.display = "block";
            emptyState.style.display = "none";
            errorMessage.style.display = "none";


            const snapshot = await db
                .collection("tests")
                .where("status", "==", "active")
                .get();


            allTests = [];

            snapshot.forEach(function (doc) {

                allTests.push({
                    id: doc.id,
                    ...doc.data()
                });

            });


            allTests.sort(function (a, b) {

                const aTime =
                    a.createdAt && a.createdAt.toMillis
                        ? a.createdAt.toMillis()
                        : 0;

                const bTime =
                    b.createdAt && b.createdAt.toMillis
                        ? b.createdAt.toMillis()
                        : 0;

                return bTime - aTime;

            });


            loading.style.display = "none";

            updateBanner();

            applySearch();

        }

        catch (error) {

            console.error("Test loading error:", error);

            loading.style.display = "none";

            errorMessage.textContent =
                "Unable to load tests. " + error.message;

            errorMessage.style.display = "block";

        }

    }


    /* ================= RENDER TESTS ================= */

    function renderTests(tests) {

        testsContainer.innerHTML = "";

        if (tests.length === 0) {

            emptyState.style.display = "block";

            return;

        }

        emptyState.style.display = "none";


        tests.forEach(function (test) {

            const card = document.createElement("div");

            card.className = "course-card";


            const questionsCount =
                Array.isArray(test.questions)
                    ? test.questions.length
                    : (test.totalQuestions || 0);

            const totalMarks = Number(test.totalMarks) || 0;

            const duration = Number(test.duration) || 0;


            card.innerHTML = `

                <div class="card-content">

                    <span class="badge">
                        Online Test
                    </span>

                    <h3>
                        ${escapeHTML(test.title || "Untitled Test")}
                    </h3>

                    <p>
                        ${escapeHTML(
                            test.description ||
                            "Test your knowledge with MCQ questions."
                        )}
                    </p>

                    <div class="test-info">

                        <p>
                            <strong>Course:</strong>
                            ${escapeHTML(test.courseId || "-")}
                        </p>

                        <p>
                            <strong>Unit:</strong>
                            ${escapeHTML(test.unit || "All Units")}
                        </p>

                        <p>
                            <strong>Questions:</strong>
                            ${questionsCount}
                        </p>

                        <p>
                            <strong>Marks:</strong>
                            ${totalMarks}
                        </p>

                        <p>
                            <strong>Duration:</strong>
                            ${duration} minutes
                        </p>

                    </div>

                    <button
                        class="btn btn-primary start-test"
                        data-id="${escapeHTML(test.id)}">
                        Start Test
                    </button>

                </div>

            `;

            testsContainer.appendChild(card);

        });


        document.querySelectorAll(".start-test").forEach(function (button) {

            button.addEventListener("click", function () {

                window.location.href =
                    "test-attempt.html?id=" +
                    encodeURIComponent(this.dataset.id);

            });

        });

    }


    /* ================= SEARCH ================= */

    function applySearch() {

        const keyword = searchInput.value.trim().toLowerCase();

        const base = allTests.filter(matchesFilter);

        if (!keyword) {

            renderTests(base);

            return;

        }

        renderTests(
            base.filter(function (test) {

                return (
                    String(test.title || "").toLowerCase().includes(keyword) ||
                    String(test.courseId || "").toLowerCase().includes(keyword) ||
                    String(test.unit || "").toLowerCase().includes(keyword) ||
                    String(test.description || "").toLowerCase().includes(keyword)
                );

            })
        );

    }

    searchInput.addEventListener("input", applySearch);


    /* ================= START ================= */

    loadTests();

});

</script>

</body>
</html>
