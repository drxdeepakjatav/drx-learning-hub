<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DRx Learning Hub - Admin Panel</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7fb;
      color: #172033;
    }

    /* LOGIN */
    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #eef5ff, #ffffff);
    }

    .login-box {
      width: 390px;
      max-width: 92%;
      background: white;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 15px 50px rgba(0,0,0,0.12);
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo h1 {
      color: #2563eb;
      font-size: 28px;
    }

    .logo p {
      color: #666;
      margin-top: 6px;
    }

    .login-box label {
      display: block;
      margin: 15px 0 7px;
      font-weight: 600;
    }

    .login-box input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d5dbe5;
      border-radius: 9px;
      outline: none;
      font-size: 15px;
    }

    .login-box input:focus {
      border-color: #2563eb;
    }

    .login-btn {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-btn:hover {
      background: #1d4ed8;
    }

    #loginMessage {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
    }

    /* ADMIN PANEL */

    .admin-panel {
      display: none;
      min-height: 100vh;
    }

    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      width: 245px;
      height: 100vh;
      background: #111827;
      color: white;
      padding: 25px 15px;
    }

    .sidebar h2 {
      text-align: center;
      color: #60a5fa;
      margin-bottom: 35px;
    }

    .sidebar button {
      width: 100%;
      padding: 13px;
      margin: 6px 0;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: #d1d5db;
      text-align: left;
      cursor: pointer;
      font-size: 15px;
    }

    .sidebar button:hover {
      background: #1f2937;
      color: white;
    }

    .logout {
      margin-top: 30px !important;
      background: #dc2626 !important;
      color: white !important;
      text-align: center !important;
    }

    .main-content {
      margin-left: 245px;
      padding: 35px;
    }

    .topbar {
      background: white;
      padding: 22px;
      border-radius: 15px;
      margin-bottom: 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 5px 20px rgba(0,0,0,0.05);
    }

    .topbar h1 {
      font-size: 25px;
    }

    .admin-name {
      color: #2563eb;
      font-weight: bold;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.06);
    }

    .card h3 {
      color: #6b7280;
      font-size: 15px;
      margin-bottom: 12px;
    }

    .card strong {
      font-size: 30px;
      color: #2563eb;
    }

    .welcome {
      margin-top: 25px;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.06);
    }

    .welcome h2 {
      margin-bottom: 10px;
    }

    @media(max-width: 900px) {
      .sidebar {
        width: 200px;
      }

      .main-content {
        margin-left: 200px;
      }

      .cards {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media(max-width: 650px) {
      .sidebar {
        position: relative;
        width: 100%;
        height: auto;
      }

      .main-content {
        margin-left: 0;
        padding: 20px;
      }

      .cards {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <!-- ================= LOGIN ================= -->

  <section class="login-page" id="loginPage">

    <div class="login-box">

      <div class="logo">
        <h1>DRx Learning Hub</h1>
        <p>Official Admin Panel</p>
      </div>

      <form id="loginForm">

        <label>Email</label>

        <input
          type="email"
          id="email"
          placeholder="Enter admin email"
          required
        >

        <label>Password</label>

        <input
          type="password"
          id="password"
          placeholder="Enter password"
          required
        >

        <button type="submit" class="login-btn">
          Login as Admin
        </button>

      </form>

      <div id="loginMessage"></div>

    </div>

  </section>


  <!-- ================= ADMIN PANEL ================= -->

  <section class="admin-panel" id="adminPanel">

    <!-- SIDEBAR -->

    <aside class="sidebar">

      <h2>DRx Admin</h2>

      <button onclick="showSection('dashboard')">
        📊 Dashboard
      </button>

<button onclick="window.location.href='admin-courses.html'">
  📚 Courses
</button>
      <button onclick="showSection('notes')">
        📄 Notes / PDF
      </button>

      <button onclick="showSection('videos')">
        🎥 Videos
      </button>

      <button onclick="showSection('tests')">
        📝 Tests
      </button>

      <button onclick="showSection('users')">
        👥 Users
      </button>

      <button class="logout" id="logoutBtn">
        🚪 Logout
      </button>

    </aside>


    <!-- MAIN -->

    <main class="main-content">

      <div class="topbar">

        <h1>Admin Dashboard</h1>

        <div>
          Welcome,
          <span class="admin-name" id="adminName">
            Admin
          </span>
        </div>

      </div>


      <!-- DASHBOARD -->

      <div id="dashboardSection">

        <div class="cards">

          <div class="card">
            <h3>Total Courses</h3>
            <strong>0</strong>
          </div>

          <div class="card">
            <h3>Total Notes</h3>
            <strong>0</strong>
          </div>

          <div class="card">
            <h3>Total Videos</h3>
            <strong>0</strong>
          </div>

          <div class="card">
            <h3>Total Users</h3>
            <strong id="userCount">0</strong>
          </div>

        </div>


        <div class="welcome">

          <h2>Welcome to DRx Learning Hub Admin Panel</h2>

          <p>
            From here you will be able to manage courses,
            notes, videos, tests and users.
          </p>

        </div>

      </div>


      <!-- OTHER SECTIONS -->

      <div id="otherSection" class="welcome" style="display:none;">

        <h2 id="sectionTitle"></h2>

        <p id="sectionText"></p>

      </div>

    </main>

  </section>


  <!-- ================= FIREBASE ================= -->

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    }
    from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";

import {
  initializeFirestore,
  doc,
  getDoc,
  collection,
  getDocs
} 
from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";


    /* FIREBASE CONFIG */

// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyC-Dcvx06CGjbiqCCXlteLG3IqY3C3x8OE",
  authDomain: "drx-learning-hub.firebaseapp.com",
  projectId: "drx-learning-hub",
  storageBucket: "drx-learning-hub.firebasestorage.app",
  messagingSenderId: "562733337038",
  appId: "1:562733337038:web:2db977c4b545cb1a5f839f",
  measurementId: "G-52EGNHBYF6"
};

    /* INITIALIZE */

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

   const db = initializeFirestore(app, {}, "default");


    /* LOGIN */

    const loginForm =
      document.getElementById("loginForm");

    loginForm.addEventListener("submit", async (e) => {

      e.preventDefault();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      const message =
        document.getElementById("loginMessage");

      message.textContent = "Logging in...";

      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

} catch (error) {
    console.error("Firebase Login Error:", error);

    message.style.color = "#dc2626";

    message.textContent =
        "Firebase Error: " + error.code + " - " + error.message;
}

    });


    /* CHECK ADMIN */

    onAuthStateChanged(auth, async (user) => {

      if (!user) {

        document.getElementById("loginPage")
          .style.display = "flex";

        document.getElementById("adminPanel")
          .style.display = "none";

        return;

      }


      try {

        const adminRef =
          doc(db, "admins", user.uid);

        const adminSnap =
          await getDoc(adminRef);


        if (
          adminSnap.exists() &&
          adminSnap.data().role === "admin" &&
          adminSnap.data().active === true
        ) {

          const adminData =
            adminSnap.data();

          document.getElementById("loginPage")
            .style.display = "none";

          document.getElementById("adminPanel")
            .style.display = "block";

          document.getElementById("adminName")
            .textContent =
            adminData.name || "Admin";


          /* USER COUNT */

          try {

            const usersSnapshot =
              await getDocs(collection(db, "users"));

            document.getElementById("userCount")
              .textContent =
              usersSnapshot.size;

          } catch (error) {

            console.log(
              "Users collection not available yet."
            );

          }

        } else {

          alert(
            "Access denied. You are not an administrator."
          );

          await signOut(auth);

        }

      } catch (error) {

        console.error(error);

        alert(
          "Admin verification failed."
        );

        await signOut(auth);

      }

    });


    /* LOGOUT */

    document
      .getElementById("logoutBtn")
      .addEventListener("click", async () => {

        await signOut(auth);

      });


    /* SIDEBAR */

    window.showSection = function(section) {

      const title =
        document.getElementById("sectionTitle");

      const text =
        document.getElementById("sectionText");

      const other =
        document.getElementById("otherSection");

      const dashboard =
        document.getElementById("dashboardSection");


      if (section === "dashboard") {

        dashboard.style.display = "block";
        other.style.display = "none";

        return;

      }


      dashboard.style.display = "none";
      other.style.display = "block";


      const data = {

        courses: [
          "📚 Courses",
          "Courses management will be added here."
        ],

        notes: [
          "📄 Notes / PDF",
          "Upload and manage study notes and PDF files here."
        ],

        videos: [
          "🎥 Videos",
          "Manage YouTube and educational videos here."
        ],

        tests: [
          "📝 Tests",
          "Create and manage online tests here."
        ],

        users: [
          "👥 Users",
          "Manage registered students here."
        ]

      };


      title.textContent = data[section][0];

      text.textContent = data[section][1];

    };

  </script>

</body>
</html>
