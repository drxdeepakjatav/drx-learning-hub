<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Student Login | DRx Learning Hub</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #eef6ff, #f8fbff);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 16px;
      padding: 35px 30px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.10);
    }

    .logo {
      text-align: center;
      margin-bottom: 10px;
    }

    .logo h1 {
      color: #1f4e8c;
      font-size: 28px;
      font-weight: 700;
    }

    .subtitle {
      text-align: center;
      color: #667085;
      margin-bottom: 28px;
      font-size: 14px;
    }

    .login-title {
      text-align: center;
      color: #172033;
      font-size: 23px;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #344054;
      font-size: 14px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #d0d5dd;
      border-radius: 8px;
      outline: none;
      font-size: 15px;
      transition: 0.2s;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
    }

    .login-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #1f4e8c;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 5px;
    }

    .login-btn:hover {
      background: #163b6c;
    }

    .login-btn:disabled {
      background: #98a2b3;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      text-align: center;
    }

    .message.success {
      display: block;
      background: #ecfdf3;
      color: #027a48;
      border: 1px solid #abefc6;
    }

    .message.error {
      display: block;
      background: #fef3f2;
      color: #b42318;
      border: 1px solid #fecdca;
    }

    .links {
      text-align: center;
      margin-top: 22px;
      line-height: 2;
      font-size: 14px;
    }

    .links a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
    }

    .links a:hover {
      text-decoration: underline;
    }

    .home-link {
      display: inline-block;
      margin-top: 5px;
    }

    .brand-footer {
      text-align: center;
      margin-top: 25px;
      color: #98a2b3;
      font-size: 12px;
    }

    @media (max-width: 480px) {
      .login-container {
        padding: 28px 20px;
      }

      .logo h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <div class="login-container">

    <div class="logo">
      <h1>DRx LEARNING HUB</h1>
    </div>

    <div class="subtitle">
      Exam-Ready Study Material for Indian University Students
    </div>

    <h2 class="login-title">Student Login</h2>

    <form id="loginForm">

      <div class="form-group">
        <label for="email">Email Address</label>

        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>

        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          required
        >
      </div>

      <button type="submit" class="login-btn" id="loginBtn">
        Login
      </button>

    </form>

    <div id="message" class="message"></div>

    <div class="links">

      <div>
        Don't have an account?
        <a href="student-register.html">Register Now</a>
      </div>

      <div>
        <a href="index.html" class="home-link">
          ← Back to Home
        </a>
      </div>

    </div>

    <div class="brand-footer">
      © 2026 DRx Learning Hub
    </div>

  </div>


  <!-- Firebase -->
  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      browserLocalPersistence,
      setPersistence
    }
      from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";


    // ==========================================
    // Firebase Configuration
    // ==========================================

    const firebaseConfig = {

      apiKey: "AIzaSyC-dcvx06CGJbiqCCXlteLG3IqY3C3x8OE",

      authDomain:
        "drx-learning-hub.firebaseapp.com",

      projectId:
        "drx-learning-hub",

      storageBucket:
        "drx-learning-hub.firebasestorage.app",

      messagingSenderId:
        "562733337038",

      appId:
        "1:562733337038:web:2db977c4b545cb1a5f839f",

      measurementId:
        "G-52EGNHBYF6"
    };


    // Initialize Firebase

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);


    // ==========================================
    // Elements
    // ==========================================

    const loginForm =
      document.getElementById("loginForm");

    const loginBtn =
      document.getElementById("loginBtn");

    const message =
      document.getElementById("message");


    // ==========================================
    // Message Function
    // ==========================================

    function showMessage(text, type) {

      message.textContent = text;

      message.className =
        "message " + type;

    }


    // ==========================================
    // Student Login
    // ==========================================

    loginForm.addEventListener("submit", async (e) => {

      e.preventDefault();

      const email =
        document.getElementById("email")
        .value
        .trim();

      const password =
        document.getElementById("password")
        .value;


      if (!email || !password) {

        showMessage(
          "Please enter email and password.",
          "error"
        );

        return;
      }


      loginBtn.disabled = true;

      loginBtn.textContent = "Logging in...";


      try {

        // Keep login session after browser refresh
        await setPersistence(
          auth,
          browserLocalPersistence
        );


        // Firebase login
        const userCredential =
          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );


        const user =
          userCredential.user;


        console.log(
          "Student logged in:",
          user.uid
        );


        showMessage(
          "Login successful! Redirecting...",
          "success"
        );


        // Redirect to Student Dashboard
        setTimeout(() => {

          window.location.href =
            "student-dashboard.html";

        }, 1000);


      } catch (error) {

        console.error(
          "Login Error:",
          error
        );


        let errorMessage =
          "Login failed. Please try again.";


        if (
          error.code ===
          "auth/invalid-credential"
        ) {

          errorMessage =
            "Invalid email or password.";

        }

        else if (
          error.code ===
          "auth/user-not-found"
        ) {

          errorMessage =
            "No student account found with this email.";

        }

        else if (
          error.code ===
          "auth/wrong-password"
        ) {

          errorMessage =
            "Incorrect password.";

        }

        else if (
          error.code ===
          "auth/invalid-email"
        ) {

          errorMessage =
            "Please enter a valid email address.";

        }

        else if (
          error.code ===
          "auth/too-many-requests"
        ) {

          errorMessage =
            "Too many login attempts. Please try again later.";

        }


        showMessage(
          errorMessage,
          "error"
        );


        loginBtn.disabled = false;

        loginBtn.textContent = "Login";

      }

    });

  </script>

</body>
</html>
